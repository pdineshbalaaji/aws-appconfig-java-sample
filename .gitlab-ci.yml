variables:
  DOCKER_REGISTRY: "registry.gitlab.com"
  DOCKER_IMAGE_NAME: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
  GRADLE_OPTS: >-
    -Dhttps.protocols=TLSv1.2
    -Dorg.gradle.daemon=false
    -Dorg.gradle.caching=true
    -Dorg.gradle.parallel=true

  GRADLE_CLI_OPTS: >-
    --no-daemon
    --stacktrace
    --info

  BUILD_IMAGE: gradle:6.9-jdk8

stages:
  - .pre
  - build
  - test
  - package

# Detect Java version from build.gradle
detect-java-version:
  image: alpine:latest
  stage: .pre
  script:
    - apk add --no-cache grep
    - |
      if grep -q "JavaVersion.VERSION_17\|sourceCompatibility.*17\|targetCompatibility.*17" build.gradle; then
        echo "BUILD_IMAGE=gradle:6.9-jdk17" > build.env
        echo "Detected Java 17 in build.gradle - Post-transformation"
      else
        echo "BUILD_IMAGE=gradle:6.9-jdk8" > build.env
        echo "Detected Java 8 in build.gradle - Pre-transformation"
      fi
    - cat build.env
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 hour

# Build movie-service-utils module
build-utils:
  image: $BUILD_IMAGE
  stage: .pre
  needs:
    - detect-java-version
  script:
    - echo "Building movie-service-utils module..."
    - ./gradlew $GRADLE_CLI_OPTS :movie-service-utils:build
  cache:
    paths:
      - .gradle/
      - movie-service-utils/build/
    key: ${CI_COMMIT_REF_SLUG}
  artifacts:
    paths:
      - movie-service-utils/build/libs/
    expire_in: 1 week

# Build stage
build:
  image: $BUILD_IMAGE
  stage: build
  needs:
    - detect-java-version
    - build-utils
  script:
    - echo "Building the application..."
    - ./gradlew $GRADLE_CLI_OPTS clean compileJava
  cache:
    paths:
      - .gradle/
      - build/
    key: ${CI_COMMIT_REF_SLUG}
  artifacts:
    paths:
      - build/
    expire_in: 1 week

# Test stage
test:
  image: $BUILD_IMAGE
  stage: test
  needs:
    - detect-java-version
    - build
  script:
    - echo "Running tests..."
    - ./gradlew $GRADLE_CLI_OPTS test
  cache:
    paths:
      - .gradle/
      - build/
    key: ${CI_COMMIT_REF_SLUG}
  artifacts:
    reports:
      junit: build/test-results/test/*.xml
    expire_in: 1 week

# Package stage with Kaniko
package:
  stage: package
  needs:
    - detect-java-version
    - test
    - build-utils
    - build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$DOCKER_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - |
      if grep -q "JavaVersion.VERSION_17\|sourceCompatibility.*17\|targetCompatibility.*17" build.gradle; then
        echo "Detected Java 17 in build.gradle - Generating Dockerfile for Java 17"
        sed 's/gradle:6.9-jdk8/gradle:6.9-jdk17/g' Dockerfile > Dockerfile.dynamic
      else
        echo "Detected Java 8 in build.gradle - Using original Dockerfile for Java 8"
        cp Dockerfile Dockerfile.dynamic
      fi
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile.dynamic"
      --destination "${DOCKER_IMAGE_NAME}"
  dependencies:
    - build-utils
    - build
  cache:
    paths:
      - .gradle/
      - build/
    key: ${CI_COMMIT_REF_SLUG}

# Q Code Transformation job - Required by Q Developer (only for pre-transformation)
q-code-transformation:
  image: $BUILD_IMAGE
  stage: build
  needs:
    - detect-java-version
    - build-utils
  script:
    - |
      if grep -q "JavaVersion.VERSION_17\|sourceCompatibility.*17\|targetCompatibility.*17" build.gradle; then
        echo "Post-transformation detected - skipping dependency copy"
        ./gradlew $GRADLE_CLI_OPTS build
      else
        echo "Pre-transformation detected - running full Q transformation"
        ./gradlew $GRADLE_CLI_OPTS build
        # Copy dependencies for Q transformation
        mkdir -p dependencies
        ./gradlew $GRADLE_CLI_OPTS copyDependencies
      fi
  cache:
    paths:
      - .gradle/
      - build/
    key: ${CI_COMMIT_REF_SLUG}
  artifacts:
    name: q-code-transformation-dependencies
    paths:
      - dependencies/*
      - build/libs/*
    when: on_success
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^q\/transform-/ && $CI_PIPELINE_SOURCE == 'push' && $BUILD_IMAGE !~ /jdk17/
      when: always
    - when: never

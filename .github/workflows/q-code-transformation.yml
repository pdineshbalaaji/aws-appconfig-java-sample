name: Q Code Transformation

on:
  push:
    branches:
      - 'Q-TRANSFORM-issue-*'

env:
   GRADLE_OPTS: >-
     -Dorg.gradle.daemon=false
     -Dorg.gradle.caching=true
     -Dorg.gradle.parallel=true

jobs:
  q-code-transformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ contains(github.event.head_commit.message, 'Code transformation completed') && '17' || '8' }}
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build movie-service-utils module
        run: |
          echo "Building movie-service-utils module..."
          ./gradlew :movie-service-utils:build --no-daemon --stacktrace

      - name: Build and copy dependencies
        run: |
          ./gradlew build --no-daemon --stacktrace
          ./gradlew copyDependencies --no-daemon --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: q-code-transformation-dependencies
          path: |
            dependencies
            build/libs

      - name: Debug information
        if: failure()
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit message: ${{ github.event.head_commit.message }}"
          echo "Java version logic result: ${{ contains(github.event.head_commit.message, 'Code transformation completed') && '17' || '8' }}"
          echo "Gradle cache contents:"
          find ~/.gradle/caches -name "*.jar" | head -10 2>/dev/null || echo "No cached JARs found"
          java -version
          ./gradlew --version
